name: tag

# Авто-тег на каждый push в main. Тег АННОТИРОВАННЫЙ: в сообщении — список коммитов от
# предыдущего тега до HEAD, поэтому `git show <tag>` и GitHub UI → Tags показывают состав
# версии без GitHub Release.
#
# Тег НЕ создаёт релиз и НЕ публикует пакет. Когда готов: Releases → «Draft a new release»
# → выбрать тег → Publish. release.yml поставит в тело релиза описание релизного PR и
# опубликует пакет в npm.
#
# Контур: на каждое событие РОВНО ОДНО действие, ничего параллельно.
#   push dev → ci (тесты)   |   merge в main → tag   |   publish Release → release (npm)
# Тесты на main НЕ гоняются намеренно: merge несёт тот же коммит, что уже проверен на dev.
#
# Источник версии — lib/package.json: тег обязан равняться тому, что реально уедет в npm,
# иначе тег и пакет разъедутся. Версию сверяет с последней записью lib/CHANGELOG.md
# scripts/check-docs.mjs (CI на каждый push в dev). Забытый бамп виден сразу: тег такой
# версии уже существует → шаг пропускается → релиза не будет.
#
# Без сторонних экшенов: список коммитов берётся `git log`, тег ставится `git tag -a`.
# git-cliff тут был, но давал ровно то же самое — держать зависимость смысла нет.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: ver
        run: |
          set -euo pipefail
          V="v$(node -p "require('./lib/package.json').version")"
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          echo "package=$V  previous tag=$PREV"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "Tag $V already exists — skipping (версия не менялась?)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "next=$V"       >> "$GITHUB_OUTPUT"
          echo "prev=$PREV"    >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: steps.ver.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          NEXT="${{ steps.ver.outputs.next }}"
          PREV="${{ steps.ver.outputs.prev }}"
          RANGE="${PREV:+$PREV..}HEAD"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            printf '%s\n\n' "$NEXT"
            git log --no-merges --pretty='- %s' "$RANGE"
          } > tag-msg.txt
          git tag -a "$NEXT" -F tag-msg.txt
          git push origin "$NEXT"
          echo "::notice::tagged $NEXT ($RANGE)"

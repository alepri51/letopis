name: ci

# Триггер ТОЛЬКО push в dev — там и живёт разработка. Ни `pull_request`, ни `push: main` тут
# нет намеренно: релизный PR dev→main и сам merge несут ТОТ ЖЕ коммит, который уже проверен
# на dev (ветка всегда пушится до PR). Любой из этих триггеров означал бы повторную проверку
# того же SHA.
#
# В CI только статические проверки (решение владельца 01.11.2026): typecheck, сверка документов
# (с шагом версии — check:semver), упаковка без живого прогона, у сайта — typecheck, ER-схемы,
# покрытие, страницы из реестров. Тесты библиотеки, примеры со снимками, песочница, сценарии
# сервисов и живой прогон пакета идут локально до выкатки: cd lib && npm run prerelease.
on:
  push:
    branches: [dev]

# Быстрые последовательные пуши в dev: держим только последний прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Полная история с тегами: check:semver сравнивает контракт API с тегом прошлого выпуска.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lib/package-lock.json

      - name: Install
        working-directory: lib
        run: npm ci

      # Тесты тоже входят в проверку типов (tsconfig.json включает test/ и bench/).
      - name: Typecheck
        working-directory: lib
        run: npm run typecheck

      # гвард против дрейфа документации: версии, мёртвые ссылки, список тестов,
      # ревизия движка, актуальность docs/api-contract.json, шаг версии против прошлого выпуска
      # (check:semver), зарезервированные имена. БД не нужна.
      - name: Check docs vs code
        working-directory: lib
        run: npm run check:docs

      # Тот же скрипт, что в release.yml: собирает тарбол, ставит его в чистую папку,
      # импортирует каждый экспорт из docs/api-contract.json и сверяет состав с полем files.
      # Живой прогон на базе (up, вход сервисом, загрузка, запись, чтение) — тест, поэтому здесь
      # он выключен (LETOPIS_PKG_LIVE=0) и идёт локально в prerelease; release.yml гоняет его
      # для опубликованного пакета.
      - name: Package check
        working-directory: lib
        env:
          LETOPIS_PKG_LIVE: '0'
        run: npm run check:package

  # Документация для людей (guide/, только локально, решение владельца от 29.10.2026). Здесь —
  # статические сверки: typecheck примеров, ER-схемы из реестра (нужна база — сервис postgres:18),
  # матрица покрытия, страницы нюансов, ошибок и справочника. Примеры со снимками, песочница и сборка
  # сайта — локально (prerelease). Идёт параллельно заданию test.
  guide:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: letopis
        ports: ['15433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d letopis"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lib/package-lock.json
            guide/package-lock.json

      # Примеры подключают letopis исходниками lib/src: нужны зависимости и библиотеки, и сайта.
      - name: Install
        run: |
          npm ci --prefix lib
          npm ci --prefix guide

      - name: Typecheck examples
        working-directory: guide
        run: npm run typecheck

      - name: ER diagrams up to date
        working-directory: guide
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15433/letopis
        run: npx tsx scripts/er.ts --check

      - name: Coverage
        working-directory: guide
        run: npm run coverage -- --strict

      - name: Nuances page up to date
        working-directory: guide
        run: npx tsx scripts/gen-nuances.ts --check && npx tsx scripts/gen-errors.ts --check && npx tsx scripts/gen-api.ts --check

      # Сверка словаря (план 2.0, этап 5, п. 2; тест-план 7.11 №1): запрещённые синонимы на страницах и в текстах
      # примеров, колонка «По-английски» глоссария против coverage/terms.ts. Статическая, без базы.
      - name: Terms
        working-directory: guide
        run: npx tsx scripts/check-terms.ts --check

      # Тесты в CI не гоняются (решение владельца 01.11.2026): примеры со снимками, песочница и сценарии сервисов,
      # как и полный набор тестов библиотеки, проходят локально до выкатки (cd lib && npm run prerelease).
      # Здесь — только статические сверки; сайт не разворачивается, его сборка — тоже локально.

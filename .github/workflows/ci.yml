name: ci

# Триггер ТОЛЬКО push в dev/main. Раньше рядом стоял `pull_request`, и релизный PR dev→main
# поднимал ВТОРОЙ прогон тех же тестов на том же коммите (push в dev его уже проверил):
# лишние 1.5 минуты ожидания и мусор в Actions. Ветка dev всегда пушится до PR, так что
# коммит на момент PR уже проверен; head PR и head dev — один и тот же SHA.
on:
  push:
    branches: [dev, main]

# Быстрые последовательные пуши: держим только последний прогон на ветку.
# На main НЕ отменяем: там прогон — часть релизного контура.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      timescale:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clockz
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d clockz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lib/package-lock.json

      - name: Install
        working-directory: lib
        run: npm ci

      - name: Apply engine + seeds (booking schema)
        run: node db/apply.mjs --dsn='postgres://postgres:test@localhost:15432/clockz' --schema=booking --version=1

      - name: Typecheck
        working-directory: lib
        run: npx tsc --noEmit

      # гвард против дрейфа документации: версии, мёртвые ссылки, список тестов,
      # счётчики сидов, codescribe-целостность, актуальность docs/api-contract.json,
      # зарезервированные имена классов, импорты bench-демо. БД не нужна.
      - name: Check docs vs code
        working-directory: lib
        run: npm run check:docs

      - name: Tests
        working-directory: lib
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15432/clockz
          ENTITY_REDIS: redis://localhost:16379
        run: npm test

# Сборку тарбола здесь НЕ делаем. Раньше стояли `npm run build` + `npm pack` с выгрузкой
# артефакта — его никто не забирал: release.yml публикует сам (свой npm ci, а prepublishOnly
# гоняет typecheck + build перед публикацией), а сам артефакт проверяется смоуком уже ИЗ
# реестра. Компиляция при этом дублировала шаг Typecheck. Итого — минус два шага на каждый пуш.

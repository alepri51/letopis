name: ci

# Триггер ТОЛЬКО push в dev — там и живёт разработка. Ни `pull_request`, ни `push: main` тут
# нет намеренно: релизный PR dev→main и сам merge несут ТОТ ЖЕ коммит, который уже проверен
# на dev (ветка всегда пушится до PR). Любой из этих триггеров означал бы повторный прогон
# одних и тех же тестов на одном и том же SHA.
on:
  push:
    branches: [dev]

# Быстрые последовательные пуши в dev: держим только последний прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # letopis 1.0 — только PostgreSQL 18 и новее (план, §2.1). После выхода 19 сюда
    # добавляется матрица с postgres:19.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: letopis
        ports: ['15433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d letopis"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lib/package-lock.json

      - name: Install
        working-directory: lib
        run: npm ci

      # Тесты тоже входят в проверку типов (tsconfig.json включает test/ и bench/).
      - name: Typecheck
        working-directory: lib
        run: npm run typecheck

      # гвард против дрейфа документации: версии, мёртвые ссылки, список тестов,
      # ревизия движка, актуальность docs/api-contract.json, зарезервированные имена. БД не нужна.
      - name: Check docs vs code
        working-directory: lib
        run: npm run check:docs

      # Схемы создаёт тестовая обвязка (lib/test/_harness.ts): отдельный накат не нужен.
      - name: Tests
        working-directory: lib
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15433/letopis
        run: npm test

      # Тот же скрипт, что в release.yml: собирает тарбол, ставит его в чистую папку,
      # импортирует каждый экспорт из docs/api-contract.json, сверяет состав с полем files и
      # делает живой прогон на сервисе postgres:18 (up, вход сервисом, загрузка, запись, чтение;
      # LETOPIS_PKG_LIVE=1 — без базы проверка красная). Так ошибка упаковки ловится на dev,
      # а не после npm publish.
      - name: Package check
        working-directory: lib
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15433/letopis
          LETOPIS_PKG_LIVE: '1'
        run: npm run check:package

  # Документация для людей (guide/, только локально, решение владельца от 29.10.2026). Исполняемые
  # примеры прогоняются на postgres:18 и обязаны совпасть со снимками в guide/snapshots: расхождение —
  # изменилось поведение библиотеки (так подтверждается исправление бага, найденного примером). Затем
  # матрица покрытия и сборка сайта (битая ссылка роняет сборку). Идёт параллельно заданию test.
  guide:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: letopis
        ports: ['15433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d letopis"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lib/package-lock.json
            guide/package-lock.json

      # Примеры подключают letopis исходниками lib/src: нужны зависимости и библиотеки, и сайта.
      - name: Install
        run: |
          npm ci --prefix lib
          npm ci --prefix guide

      - name: Typecheck examples
        working-directory: guide
        run: npm run typecheck

      - name: Examples vs snapshots
        working-directory: guide
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15433/letopis
        run: npm run examples -- --check

      - name: Coverage
        working-directory: guide
        run: npm run coverage -- --strict

      - name: Nuances page up to date
        working-directory: guide
        run: npx tsx scripts/gen-nuances.ts --check && npx tsx scripts/gen-errors.ts --check

      - name: Build site
        working-directory: guide
        run: npm run build

      # Песочница сайта: сервер с SANDBOX=1 прогоняет присланный со страницы пример в свежей схеме — снимок обязан
      # совпасть с записанным; запрос без Origin сайта сервер отклоняет.
      - name: Sandbox run
        working-directory: guide
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15433/letopis
          SANDBOX: '1'
          PORT: '8095'
        run: |
          node server.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8095/api/sandbox && break; sleep 1; done
          node -e "const fs = require('fs'); const id = 'basics/01-first-object'; fs.writeFileSync('/tmp/sbx.json', JSON.stringify({ id, source: fs.readFileSync('examples/' + id + '.ts', 'utf8') }))"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/sbx.json http://127.0.0.1:8095/api/run)" = 403
          curl -sf -X POST -H 'origin: http://127.0.0.1:8095' -H 'content-type: application/json' --data-binary @/tmp/sbx.json http://127.0.0.1:8095/api/run > /tmp/sbx-out.json
          node -e "const fs = require('fs'); const r = JSON.parse(fs.readFileSync('/tmp/sbx-out.json', 'utf8')); const want = fs.readFileSync('snapshots/basics/01-first-object.json', 'utf8').replace(/\r\n/g, '\n'); if (r.error || r.failures.length || JSON.stringify(r.snapshot, null, 2) + '\n' !== want) { console.error(r.error ?? r.failures); process.exit(1) } console.log('песочница: снимок совпал')"

      # Сервисы-примеры: сценарий «день работы» через HTTP в том же процессе, на сервисе postgres:18.
      - name: Salon day-of-work scenario
        env:
          ADMIN_DSN: postgres://postgres:test@localhost:15433/letopis
          APP_DSN: postgres://salon_app:salon-app-secret@localhost:15433/letopis
        run: |
          npm run build --prefix lib
          npm install --prefix services/salon --no-audit --no-fund
          node services/salon/scenario.mjs

      - name: Wallet day-of-work scenario
        env:
          ADMIN_DSN: postgres://postgres:test@localhost:15433/letopis
          APP_DSN: postgres://wallet_app:wallet-app-secret@localhost:15433/letopis
        run: |
          npm install --prefix services/wallet --no-audit --no-fund
          node services/wallet/scenario.mjs

      - name: Helpdesk day-of-work scenario
        env:
          ADMIN_DSN: postgres://postgres:test@localhost:15433/letopis
          APP_DSN: postgres://helpdesk_app:helpdesk-app-secret@localhost:15433/letopis
        run: |
          npm install --prefix services/helpdesk --no-audit --no-fund
          node services/helpdesk/scenario.mjs

      - name: Documents day-of-work scenario
        env:
          ADMIN_DSN: postgres://postgres:test@localhost:15433/letopis
          APP_DSN: postgres://documents_app:documents-app-secret@localhost:15433/letopis
        run: |
          npm install --prefix services/documents --no-audit --no-fund
          node services/documents/scenario.mjs

name: ci

# Триггер ТОЛЬКО push в dev — там и живёт разработка. Ни `pull_request`, ни `push: main` тут
# нет намеренно: релизный PR dev→main и сам merge несут ТОТ ЖЕ коммит, который уже проверен
# на dev (ветка всегда пушится до PR). Любой из этих триггеров означал бы повторный прогон
# одних и тех же тестов на одном и том же SHA.
on:
  push:
    branches: [dev]

# Быстрые последовательные пуши в dev: держим только последний прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      timescale:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clockz
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d clockz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lib/package-lock.json

      - name: Install
        working-directory: lib
        run: npm ci

      - name: Apply engine + seeds (booking schema)
        run: node db/apply.mjs --dsn='postgres://postgres:test@localhost:15432/clockz' --schema=booking --version=1

      - name: Typecheck
        working-directory: lib
        run: npx tsc --noEmit

      # гвард против дрейфа документации: версии, мёртвые ссылки, список тестов,
      # счётчики сидов, codescribe-целостность, актуальность docs/api-contract.json,
      # зарезервированные имена классов, импорты bench-демо. БД не нужна.
      - name: Check docs vs code
        working-directory: lib
        run: npm run check:docs

      - name: Tests
        working-directory: lib
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15432/clockz
          ENTITY_REDIS: redis://localhost:16379
        run: npm test

# Сборку тарбола здесь НЕ делаем. Раньше стояли `npm run build` + `npm pack` с выгрузкой
# артефакта — его никто не забирал: release.yml публикует сам (свой npm ci, а prepublishOnly
# гоняет typecheck + build перед публикацией), а сам артефакт проверяется смоуком уже ИЗ
# реестра. Компиляция при этом дублировала шаг Typecheck. Итого — минус два шага на каждый пуш.

# Прод-публикация: на publish GitHub Release → npm publish пакета lib/.
# Требует секрет NPM_TOKEN (granular automation token npm с правом publish на letopis).
# prepublishOnly сам гоняет typecheck + build.
name: release

on:
  release:
    types: [published]

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: lib/package-lock.json
      - name: Install
        working-directory: lib
        run: npm ci
      - name: Publish to npm
        working-directory: lib
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# Прод-публикация — ОТДЕЛЬНЫЙ ШАГ, только по команде (как в VP): тег ставит tag.yml на push
# в main, а релиз публикуется вручную — Releases → «Draft a new release» → выбрать тег →
# Publish. На publish этот workflow ставит в тело релиза описание релизного PR (dev→main)
# и публикует пакет lib/ в npm, затем проверяет артефакт смоуком из реестра.
#
# Логика как в VP: тег → заметки → прод. Прод у библиотеки — npm. Отличие: заметки берутся
# из описания PR, а сводка по коммитам — в аннотации тега (git log, без сторонних экшенов).
#
# Требует секрет NPM_TOKEN (granular automation token npm с правом publish на letopis).
# prepublishOnly сам гоняет typecheck + build.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write        # gh release edit
  pull-requests: read    # gh pr list/view — заметки берутся из описания PR.
                         # NB: блок permissions ОГРАНИЧИВАЕТ токен: без этой строки
                         # gh падает 'Resource not accessible by integration'.

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Тело релиза = описание релизного PR dev→main. Оно писалось осмысленно (что и почему,
      # с замерами), в отличие от списка заголовков коммитов. PR ищем по коммиту, на который
      # указывает тег: у merge-коммита PR ровно один. Сводка по Conventional Commits и так
      # лежит в аннотации тега (tag.yml), содержательный changelog — в lib/CHANGELOG.md.
      - name: Take release notes from the merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          SHA="$(git rev-list -n 1 "$TAG")"
          PR="$(gh pr list --state merged --base main --limit 30 \
                  --json number,mergeCommit \
                  --jq ".[] | select(.mergeCommit.oid == \"$SHA\") | .number" | head -n 1)"
          if [ -z "$PR" ]; then
            echo "::warning::для тега $TAG ($SHA) не нашёлся merged PR в main — тело релиза оставлено как есть"
            exit 0
          fi
          gh pr view "$PR" --json body --jq .body > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::описание PR #$PR пустое — тело релиза оставлено как есть"
            exit 0
          fi
          gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          echo "::notice::тело релиза $TAG взято из PR #$PR"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: lib/package-lock.json
      - name: Install
        working-directory: lib
        run: npm ci
      - name: Publish to npm
        working-directory: lib
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Проверка АРТЕФАКТА, а не исходников: тесты гоняются по lib/src, а в npm уезжает
      # собранный dist + files из package.json. Сломанные exports/types/files тут ловятся
      # сразу, а не от первого пользователя. Ставим пакет из реестра в чистую папку.
      - name: Smoke-test the published package
        run: |
          set -euo pipefail
          V="$(node -p "require('./lib/package.json').version")"
          echo "ждём появления letopis@$V в реестре…"
          for i in $(seq 1 30); do
            npm view "letopis@$V" version >/dev/null 2>&1 && break
            sleep 5
          done
          npm view "letopis@$V" version
          mkdir -p /tmp/letopis-smoke && cd /tmp/letopis-smoke
          echo '{"name":"smoke","private":true,"type":"module"}' > package.json
          npm install "letopis@$V" --no-audit --no-fund
          cat > smoke.mjs <<'JS'
          import { connect, up, cursorOf, uuidv5, uuidv7, LETOPIS_NS, totpCode,
                   ValidationError, Registry, ne, gt, between, inList, like, has, exists, or } from 'letopis';
          const need = { connect, up, cursorOf, uuidv5, uuidv7, LETOPIS_NS, totpCode, ValidationError, Registry };
          for (const [k, v] of Object.entries(need)) if (v === undefined) throw new Error(`экспорт ${k} отсутствует`);
          if (typeof connect !== 'function' || typeof up !== 'function') throw new Error('connect/up не функции');
          if (uuidv5('a:b:c') !== uuidv5('a:b:c')) throw new Error('uuidv5 недетерминирован');
          if (!/^[0-9a-f-]{36}$/.test(uuidv7())) throw new Error('uuidv7 не uuid');
          console.log('ok: пакет ставится из npm, ESM-импорт и 17 экспортов на месте');
          JS
          node smoke.mjs
          node -e "const p=require('/tmp/letopis-smoke/node_modules/letopis/package.json');
            const fs=require('node:fs');
            for (const f of ['dist/index.js','dist/index.d.ts','sql/ddl.sql','scripts/gen-types.mjs','README.md','LICENSE'])
              if (!fs.existsSync('/tmp/letopis-smoke/node_modules/letopis/'+f)) throw new Error('в тарболе нет '+f);
            console.log('ok: тарбол содержит dist, sql, scripts, README, LICENSE');"

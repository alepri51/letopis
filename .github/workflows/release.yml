# Прод-публикация — ОТДЕЛЬНЫЙ ШАГ, только по команде (как в VP): тег ставит tag.yml на push
# в main, а релиз публикуется вручную — Releases → «Draft a new release» → выбрать тег →
# Publish. На publish этот workflow по очереди: ставит в тело релиза секцию lib/CHANGELOG.md
# этой версии (scripts/release-notes.mjs), сверяет шаг версии с прошлым выпуском
# (check:semver --release), публикует пакет lib/ в npm (версия с дефисом — под dist-tag next)
# и проверяет артефакт из реестра (check-package.mjs с живым прогоном на сервисе postgres:18).
#
# Логика как в VP: тег → заметки → прод. Прод у библиотеки — npm. Заметки — из CHANGELOG
# (тем же скриптом собирается описание релизного PR), сводка по коммитам — в аннотации тега
# (git log, без сторонних экшенов).
#
# Требует секрет NPM_TOKEN (granular automation token npm с правом publish на letopis).
# npm publish запускает prepublishOnly из lib/package.json: typecheck, check:docs и build.
# Тестов здесь нет (unit-тестов в проекте нет — решение владельца); проверка поведения —
# локально перед выпуском (lib/scripts/prerelease.mjs).
name: release

on:
  release:
    types: [published]

permissions:
  contents: write   # gh release edit — больше ничего не нужно

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    # PostgreSQL 18 — для живого прогона опубликованного пакета (check-package.mjs, план §7.10 №8.2).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: letopis
        ports: ['15433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d letopis"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Тело релиза = секция CHANGELOG этой версии — тем же скриптом, которым собиралось
      # описание релизного PR. Раньше здесь читалось описание PR через gh pr list/view, но это
      # требует прав pull-requests и упиралось в «Resource not accessible by integration»
      # (GITHUB_TOKEN на release-событии не получает доступ к PR-API этого репозитория).
      # Чекаут стоит на теге, значит package.json и CHANGELOG — ровно той версии, что публикуем.
      - name: Release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node lib/scripts/release-notes.mjs > RELEASE_NOTES.md
          gh release edit "${{ github.event.release.tag_name }}" --notes-file RELEASE_NOTES.md
          echo "::notice::тело релиза взято из lib/CHANGELOG.md"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: lib/package-lock.json
      # setup-node v7 больше не выставляет заглушку NODE_AUTH_TOKEN (actions/setup-node#1558), а .npmrc
      # от registry-url ссылается на неё. npm ci получает заглушку, как было при v4: настоящий токен —
      # только у шага публикации, скрипты установки зависимостей его не видят.
      - name: Install
        working-directory: lib
        run: npm ci
        env:
          NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX
      # Шаг версии против прошлого выпуска (README, «Версии и совместимость»): контракт API и ревизия
      # движка из тега этой версии сравниваются с тегом прошлого выпуска; неверный шаг — публикации нет.
      - name: Check semver
        working-directory: lib
        run: npm run check:semver -- --release
      # Версии с дефисом (1.1.0-rc.1 и т.п.) уходят под dist-tag next, чтобы не стать latest.
      - name: Publish to npm
        working-directory: lib
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          if [[ "$V" == *-* ]]; then npm publish --tag next; else npm publish; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Проверка АРТЕФАКТА из реестра тем же скриптом, что на dev: каждый экспорт из
      # lib/api-contract.json импортируется, команда letopis из node_modules/.bin печатает справку,
      # состав тарбола совпадает с полем files, живой прогон на сервисе postgres:18 обязателен:
      # setup(мастер-ключ) строит дом и отдаёт пропуск, connect(пропуск) — консьерж, квартира,
      # приглашение и вход жильца ключом, запись и чтение, затем demolish. `npm view` видит свежую версию раньше,
      # чем `npm install`, поэтому установку из реестра скрипт сам повторяет до ~5 минут.
      - name: Check the published package
        working-directory: lib
        env:
          ENTITY_DSN: postgres://postgres:test@localhost:15433/letopis
          LETOPIS_PKG_LIVE: '1'
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          echo "ждём появления letopis@$V в реестре…"
          for i in $(seq 1 30); do
            npm view "letopis@$V" version --prefer-online >/dev/null 2>&1 && break
            sleep 5
          done
          node scripts/check-package.mjs --registry="$V"

# git-cliff config — группирует Conventional Commits в человекочитаемый changelog,
# который идёт (1) в аннотацию тега (tag.yml) и (2) в тело GitHub Release (release.yml).
#
# NB: это НЕ замена lib/CHANGELOG.md. Тот пишется руками, содержит «почему» и замеры и
# является источником истины версии (её же проверяет scripts/check-docs.mjs против
# lib/package.json). git-cliff здесь отвечает только за автоматические заметки к тегу
# и релизу — по заголовкам коммитов.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group }}

{% for commit in commits -%}
- {% if commit.scope -%}**{{ commit.scope }}**: {% endif -%}
  {{ commit.message | split(pat="\\n") | first | upper_first | trim }}{% if commit.breaking %} _(breaking)_{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
topo_order = false
protect_breaking_commits = true

commit_parsers = [
  { message = "^feat",     group = "Features" },
  { message = "^fix",      group = "Bug Fixes" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs",     group = "Documentation" },
  { message = "^ci",       group = "CI/CD" },
  { message = "^build",    group = "Build" },
  { message = "^test",     group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore",    group = "Misc" },
  { message = "^revert",   group = "Reverts" },
  { message = "^Merge",    skip = true },
]
